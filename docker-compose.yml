# xtai-nav 服务器部署（模式 A：与 xtai-notion 同机）
# 公网 80/443 由 xtai-notion 的 xtai-nginx 反代本容器，须先启动 xtai-notion（xtai-shared 网络）
#
#   docker compose --env-file .env up -d --build
#
# 模式 B：仅部署本仓库（自带 nginx）→ 见 docker-compose.standalone.yml、DEPLOY-STANDALONE.md

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        DATABASE_URL: ${DATABASE_URL}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    container_name: xtai-nav-web
    restart: unless-stopped
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - xtai-shared
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  xtai-shared:
    name: xtai-shared
    external: true
